<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة التدفقات النقدية الشهرية</title>
<style>
  :root{
    --paper:#0B1420;
    --card:#132238;
    --card-alt:#0E1B2C;
    --ink:#F2EFEA;
    --ink-soft:#C7D0DD;
    --slate:#93A2B8;
    --slate-soft:#6C7B90;
    --line:#22374F;
    --success:#34D399;
    --success-soft:rgba(52,211,153,.14);
    --danger:#FB7185;
    --danger-soft:rgba(251,113,133,.14);
    --warning:#FBBF24;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.35);
    --radius: 16px;
  }
  :root[data-theme="light"]{
    --paper:#F8FAFC;
    --card:#FFFFFF;
    --card-alt:#F8FAFC;
    --ink:#0F172A;
    --ink-soft:#334155;
    --slate:#64748B;
    --slate-soft:#94A3B8;
    --line:#E2E8F0;
    --success:#0E9F6E;
    --success-soft:#DCFCE7;
    --danger:#E11D48;
    --danger-soft:#FFE4E6;
    --warning:#B45309;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  .mono{ font-family:'Consolas','SFMono-Regular',ui-monospace,monospace; font-variant-numeric: tabular-nums; direction:ltr; unicode-bidi:plaintext; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 0 80px; }

  /* ---------- Setup gate ---------- */
  .gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate .card{ max-width:420px; width:100%; }
  .gate h1{ font-size:20px; margin:0 0 6px; font-weight:700; }
  .gate p.desc{ font-size:13.5px; color:var(--slate); line-height:1.7; margin:0 0 22px; }

  /* ---------- Header ---------- */
  header.top{
    background:var(--card);
    border-bottom:1px solid var(--line);
    margin-bottom:24px;
  }
  header.top .inner{
    max-width:1100px;
    margin:0 auto;
    padding:16px 20px 0;
  }
  .row1{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  header.top h1{ font-size:16.5px; font-weight:700; margin:0; }
  .controls{ display:flex; align-items:center; gap:8px; }
  .icon-toggle{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line); background:var(--card-alt); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px;
  }
  .icon-toggle:hover{ border-color:var(--success); }
  .lang-toggle{
    border-radius:18px; padding:0 13px; height:36px;
    font-family:inherit; font-weight:700; font-size:12px;
    border:1px solid var(--line); background:var(--card-alt); color:var(--ink); cursor:pointer;
  }
  .lang-toggle:hover{ border-color:var(--success); }

  .month-nav{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card-alt);
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px;
    width:fit-content;
  }
  .month-nav button{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--slate);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    padding:6px 10px;
    border-radius:7px;
    cursor:pointer;
  }
  .month-nav button:hover{ color:var(--ink); background:var(--card); }
  .month-nav .label{ font-weight:700; font-size:13.5px; min-width:110px; text-align:center; }
  .month-nav-row{ margin-bottom:14px; }

  .tabs{ display:flex; gap:2px; overflow-x:auto; padding-bottom:1px; scrollbar-width:thin; }
  .tab{
    appearance:none;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    color:var(--slate);
    padding:11px 14px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
    flex-shrink:0;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--success); border-bottom-color:var(--success); }

  main.content{ max-width:1100px; margin:0 auto; padding:0 20px; }

  /* ---------- Cards / generic ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
  }
  .grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:14px; }
  @media (max-width:720px){ .grid-4{ grid-template-columns:1fr 1fr; } .grid-2{ grid-template-columns:1fr; } .grid-3{ grid-template-columns:1fr; } }
  @media (max-width:460px){ .grid-4{ grid-template-columns:1fr; } }

  .stat-tile .k{ font-size:12px; font-weight:600; color:var(--slate); margin-bottom:8px; }
  .stat-tile .v{ font-size:20px; font-weight:700; }
  .v.positive{ color:var(--success); }
  .v.negative{ color:var(--danger); }
  .stat-tile .edit-link{
    display:inline-block; margin-top:8px; font-size:11.5px; color:var(--slate-soft);
    background:none; border:none; cursor:pointer; font-family:inherit; padding:0; text-decoration:underline;
  }
  .stat-tile .edit-link:hover{ color:var(--success); }

  .breakdown h3{ font-size:15px; font-weight:700; margin:0 0 14px; }
  .breakdown .empty{ font-size:13px; color:var(--slate-soft); }
  .breakdown ul{ list-style:none; margin:0; padding:0; }
  .breakdown li{ margin-bottom:12px; }
  .breakdown li:last-child{ margin-bottom:0; }
  .breakdown .line{ display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; margin-bottom:6px; gap:8px; }
  .breakdown .line .name{ color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .breakdown .line .amt-wrap{ display:flex; align-items:baseline; gap:8px; flex-shrink:0; }
  .breakdown .line .pct{ font-size:11.5px; color:var(--slate-soft); }
  .breakdown .line .amt{ font-weight:600; }
  .bar-track{ height:6px; border-radius:6px; background:var(--card-alt); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; }
  .bar-fill.income{ background:var(--success); }
  .bar-fill.expense{ background:var(--danger); }

  /* ---------- Forms ---------- */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink-soft); }
  .field input, .field select{
    width:100%;
    font-family:inherit;
    font-size:14px;
    padding:10px 12px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:var(--card-alt);
    color:var(--ink);
    outline:none;
  }
  .field input:focus, .field select:focus{ border-color:var(--success); }
  .field .err{ font-size:12px; color:var(--danger); margin-top:6px; min-height:0; }
  .warn-text{ font-size:12px; color:var(--warning); margin-top:6px; }

  .type-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .type-btn{
    flex:1;
    appearance:none;
    border:1.5px solid var(--line);
    background:var(--card-alt);
    color:var(--slate);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:10px;
    border-radius:9px;
    cursor:pointer;
  }
  .type-btn.active-income{ background:var(--success); border-color:var(--success); color:#08150F; }
  .type-btn.active-expense{ background:var(--danger); border-color:var(--danger); color:#2B0710; }
  :root[data-theme="light"] .type-btn.active-income{ color:#fff; }
  :root[data-theme="light"] .type-btn.active-expense{ color:#fff; }

  .btn-primary{
    width:100%;
    appearance:none;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:var(--paper);
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    padding:12px;
    cursor:pointer;
  }
  .btn-primary:hover{ opacity:.9; }
  .btn-primary.income-btn{ background:var(--success); color:#08150F; }
  .btn-primary.expense-btn{ background:var(--danger); color:#2B0710; }
  :root[data-theme="light"] .btn-primary.income-btn{ color:#fff; }
  :root[data-theme="light"] .btn-primary.expense-btn{ color:#fff; }
  .btn-row{ display:flex; gap:8px; }
  .btn-ghost{
    appearance:none;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--slate);
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
    padding:12px 16px;
    border-radius:10px;
    cursor:pointer;
  }
  .btn-ghost:hover{ background:var(--card-alt); color:var(--ink); }
  .btn-block{ width:100%; }

  /* ---------- Transactions layout ---------- */
  .tx-layout{ display:grid; grid-template-columns:360px 1fr; gap:16px; align-items:start; }
  @media (max-width:820px){ .tx-layout{ grid-template-columns:1fr; } }

  .list-card{ padding:0; overflow:hidden; }
  .list-card .head{ padding:16px 20px; border-bottom:1px solid var(--line); font-weight:700; font-size:14.5px; }
  .table-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{ text-align:start; font-size:11.5px; font-weight:600; color:var(--slate); padding:8px 20px; border-bottom:1px solid var(--line); white-space:nowrap; }
  thead th.amt{ text-align:end; }
  tbody td{ padding:12px 20px; border-bottom:1px solid var(--line); color:var(--ink-soft); white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--card-alt); }
  td.amt{ text-align:end; font-weight:700; }
  td.amt.income{ color:var(--success); }
  td.amt.expense{ color:var(--danger); }
  td.actions{ text-align:end; white-space:nowrap; }
  .icon-btn{
    appearance:none; border:none; background:transparent; cursor:pointer;
    font-size:13px; padding:4px 6px; color:var(--slate-soft);
  }
  .icon-btn:hover{ color:var(--ink); }
  .icon-btn.danger:hover{ color:var(--danger); }
  .list-empty{ padding:36px 20px; text-align:center; font-size:13.5px; color:var(--slate-soft); }

  /* ---------- Categories ---------- */
  .cat-layout{ display:flex; gap:14px; flex-wrap:wrap; }
  .cat-col{ flex:1; min-width:280px; }
  .cat-col h3{ font-size:15px; font-weight:700; margin:0 0 14px; }
  .cat-col.income h3{ color:var(--success); }
  .cat-col.expense h3{ color:var(--danger); }
  .cat-list{ list-style:none; margin:0 0 14px; padding:0; }
  .cat-list li{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--card-alt); border-radius:9px; padding:9px 12px; margin-bottom:8px;
  }
  .cat-list .name{ font-size:13.5px; color:var(--ink-soft); }
  .cat-list input.edit-name{
    flex:1; font-family:inherit; font-size:13px; padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  .cat-add-row{ display:flex; gap:8px; }
  .cat-add-row input{
    flex:1; font-family:inherit; font-size:13.5px; padding:10px 12px; border-radius:9px; border:1.5px solid var(--line); background:var(--card-alt); color:var(--ink);
  }
  .cat-add-row button{
    appearance:none; border:none; border-radius:9px; color:#fff; font-family:inherit; font-weight:600; font-size:13.5px; padding:0 16px; cursor:pointer;
  }
  .cat-col.income .cat-add-row button{ background:var(--success); }
  .cat-col.expense .cat-add-row button{ background:var(--danger); }
  .cat-empty{ font-size:13px; color:var(--slate-soft); margin-bottom:10px; }

  h2.section-title{ font-size:16px; font-weight:700; margin:4px 0 4px; }
  p.section-desc{ font-size:13px; color:var(--slate); margin:0 0 16px; line-height:1.6; }

  /* ---------- Reports ---------- */
  .cmp-bars{ display:flex; flex-direction:column; gap:3px; min-width:90px; }
  .cmp-bar{ height:6px; border-radius:4px; background:var(--card-alt); }
  .cmp-bar > div{ height:100%; border-radius:4px; }
  .cmp-bar.income > div{ background:var(--success); }
  .cmp-bar.expense > div{ background:var(--danger); }
  td.net.positive{ color:var(--success); }
  td.net.negative{ color:var(--danger); }

  /* ---------- Credit cards ---------- */
  .cards-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin-top:16px; }
  .card-tile .top-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:8px; }
  .card-tile .name{ font-size:15px; font-weight:700; }
  .card-tile .limit{ font-size:12px; color:var(--slate); margin-top:3px; }
  .card-tile .usage-line{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; }
  .card-tile .usage-line .used{ font-weight:700; }
  .usage-track{ height:8px; border-radius:6px; background:var(--card-alt); overflow:hidden; margin-bottom:14px; }
  .usage-fill{ height:100%; border-radius:6px; }
  .usage-fill.ok{ background:var(--success); }
  .usage-fill.warn{ background:var(--warning); }
  .usage-fill.danger{ background:var(--danger); }
  .card-tile .available{ font-size:12px; color:var(--slate); margin-bottom:14px; }
  .card-edit-fields{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .card-edit-fields input{
    font-family:inherit; font-size:13px; padding:8px 10px; border-radius:7px; border:1px solid var(--line); background:var(--card-alt); color:var(--ink);
  }
  .card-back-btn{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--slate);
    font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer; padding:0; margin-bottom:16px;
  }
  .card-back-btn:hover{ color:var(--ink); }
  .card-detail-header{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .card-detail-header h2{ font-size:17px; font-weight:700; margin:0 0 4px; }
  .card-detail-header .sub{ font-size:12.5px; color:var(--slate); }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  var STORAGE_KEY = 'thamer-cashflow-data-v2';

  var DEFAULT_CATEGORIES = [
    { id: 'inc-salary', name: 'راتب', type: 'income' },
    { id: 'inc-other', name: 'إيرادات أخرى', type: 'income' },
    { id: 'exp-rent', name: 'إيجار', type: 'expense' },
    { id: 'exp-food', name: 'مأكل ومشرب', type: 'expense' },
    { id: 'exp-transport', name: 'مواصلات', type: 'expense' },
    { id: 'exp-other', name: 'مصاريف أخرى', type: 'expense' }
  ];

  function defaultState() {
    return {
      openingBalance: null,
      openingBalanceDate: null,
      categories: DEFAULT_CATEGORIES.slice(),
      transactions: [],
      creditCards: [],
      cardTransactions: [],
      theme: 'dark',
      lang: 'ar'
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var d = defaultState();
      return {
        openingBalance: parsed.openingBalance != null ? parsed.openingBalance : null,
        openingBalanceDate: parsed.openingBalanceDate || null,
        categories: parsed.categories || d.categories,
        transactions: parsed.transactions || [],
        creditCards: parsed.creditCards || [],
        cardTransactions: parsed.cardTransactions || [],
        theme: parsed.theme || 'dark',
        lang: parsed.lang || 'ar'
      };
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  var MONTHS = {
    ar: ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],
    en: ['January','February','March','April','May','June','July','August','September','October','November','December']
  };

  function pad2(n) { return String(n).padStart(2, '0'); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function currentMonthKey() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
  function monthKeyOf(dateStr) { return dateStr.slice(0, 7); }
  function shiftMonth(monthKey, delta) {
    var parts = monthKey.split('-').map(Number);
    var d = new Date(parts[0], parts[1] - 1 + delta, 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function formatMonthLabel(monthKey) {
    var parts = monthKey.split('-').map(Number);
    return MONTHS[state.lang][parts[1] - 1] + ' ' + parts[0];
  }
  function formatCurrency(amount) {
    var rounded = Math.round(amount * 100) / 100;
    return rounded.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + t('currency_suffix');
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(str) { return escapeHtml(str).replace(/`/g, '&#96;'); }

  // ---------------- i18n ----------------

      th_month: 'الشهر',
      th_opening: 'الافتتاحي',
      th_income: 'المداخيل',
      th_expense: 'المصاريف',
      th_net: 'صافي التغيّر',
      th_closing: 'الختامي',
      th_compare: 'مقارنة',
      reports_empty: 'لا توجد بيانات كافية بعد لعرض التقرير',

  function applyDocumentLangTheme() {
    var html = document.documentElement;
    html.setAttribute('lang', state.lang);

  // ---------------- Finance calculations ----------------
  function computeMonthSummary(monthKey) {
    var opening = state.openingBalance != null ? state.openingBalance : 0;
    var priorNet = 0, monthIncome = 0, monthExpense = 0;
    var incomeTotals = {}, expenseTotals = {};

    state.transactions.forEach(function (tx) {
      var tKey = monthKeyOf(tx.date);
      var signed = tx.type === 'income' ? tx.amount : -tx.amount;
      if (tKey < monthKey) {
        priorNet += signed;
      } else if (tKey === monthKey) {
        if (tx.type === 'income') {
          monthIncome += tx.amount;
          incomeTotals[tx.categoryId] = (incomeTotals[tx.categoryId] || 0) + tx.amount;
        } else {
          monthExpense += tx.amount;
          expenseTotals[tx.categoryId] = (expenseTotals[tx.categoryId] || 0) + tx.amount;
        }
      }
    });

    var catById = {};
    state.categories.forEach(function (c) { catById[c.id] = c; });

    function toBreakdown(totals, total) {
      return Object.keys(totals).map(function (categoryId) {
        var category = catById[categoryId] || { id: categoryId, name: t('field_category') };
        var amt = totals[categoryId];
        var pct = total > 0 ? Math.round((amt / total) * 100) : 0;
        return { category: category, total: amt, pct: pct };
      }).sort(function (a, b) { return b.total - a.total; });
    }

    var openingBalance = opening + priorNet;
    return {
      monthKey: monthKey,
      openingBalance: openingBalance,
      totalIncome: monthIncome,
      totalExpense: monthExpense,
      closingBalance: openingBalance + monthIncome - monthExpense,
      incomeByCategory: toBreakdown(incomeTotals, monthIncome),
      expenseByCategory: toBreakdown(expenseTotals, monthExpense)
    };
  }

  function getReportMonthKeys() {
    var earliest = null;
    if (state.openingBalanceDate) earliest = monthKeyOf(state.openingBalanceDate);
    state.transactions.forEach(function (tx) {
      var k = monthKeyOf(tx.date);
      if (earliest === null || k < earliest) earliest = k;
    });
    var latest = currentMonthKey();
    state.transactions.forEach(function (tx) {
      var k = monthKeyOf(tx.date);
      if (k > latest) latest = k;
    });
    if (earliest === null) earliest = latest;

    var keys = [];
    var cursor = earliest;
    var guard = 0;
    while (cursor <= latest && guard < 240) {
      keys.push(cursor);
      cursor = shiftMonth(cursor, 1);
      guard++;
    }
    return keys.reverse();
  }

  function computeCardBalance(cardId) {
    var balance = 0;
    state.cardTransactions.forEach(function (tx) {
      if (tx.cardId !== cardId) return;
      balance += tx.type === 'purchase' ? tx.amount : -tx.amount;
    });
    return balance;
  }

  // ---------------- Credit cards tab ----------------
  function renderCards() {
    if (selectedCardId) {
      var card = state.creditCards.find(function (c) { return c.id === selectedCardId; });
      if (card) return renderCardDetail(card);
      selectedCardId = null;
    }
    return renderCardsList();
  }

  function usageLevelClass(pct) {
    if (pct >= 90) return 'danger';
    if (pct >= 70) return 'warn';
    return 'ok';
  }

  function renderCardsList() {
    var addForm = (
      '<form id="card-form" class="card" style="margin-bottom:16px;">' +
      '<div class="grid-2">' +
      '<div class="field"><label>' + t('card_name_label') + '</label><input type="text" id="card-name" placeholder="' + t('card_name_placeholder') + '"></div>' +
      '<div class="field"><label>' + t('card_limit_label') + '</label><input type="number" step="0.01" id="card-limit" placeholder="0.00"></div>' +
      '</div>' +
      '<div id="card-err" class="err"></div>' +
      '<button type="submit" class="btn-primary btn-block">' + t('add_card_btn') + '</button>' +
      '</form>'
    );

    var tiles;
    if (state.creditCards.length === 0) {
      tiles = '<div class="card"><p class="empty">' + t('cards_empty') + '</p></div>';
    } else {
      tiles = '<div class="cards-grid">' + state.creditCards.map(function (c) {
        var balance = computeCardBalance(c.id);
        var pct = c.limit > 0 ? Math.max(0, Math.min(100, Math.round((balance / c.limit) * 100))) : 0;
        var levelCls = usageLevelClass(pct);
        var available = c.limit - balance;

        if (editingCardId === c.id) {
          return (
            '<div class="card card-tile">' +
            '<div class="card-edit-fields">' +
            '<input id="edit-card-name" value="' + escapeAttr(c.name) + '">' +
            '<input id="edit-card-limit" type="number" step="0.01" value="' + c.limit + '">' +
            '</div>' +
            '<div id="card-edit-err" class="err" style="margin-bottom:10px;"></div>' +
            '<div class="btn-row"><button class="btn-ghost" style="flex:1;" data-action="save-card-edit" data-id="' + c.id + '">' + t('save') + '</button>' +
            '<button class="btn-ghost" data-action="cancel-card-edit">' + t('cancel') + '</button></div>' +
            '</div>'
          );
        }

        return (
          '<div class="card card-tile">' +
          '<div class="top-row"><div><div class="name">' + escapeHtml(c.name) + '</div>' +
          '<div class="limit">' + t('card_limit_label') + ': <span class="mono">' + formatCurrency(c.limit) + '</span></div></div>' +
          '<div><button class="icon-btn" data-action="edit-card" data-id="' + c.id + '" title="edit">✏️</button>' +
          '<button class="icon-btn danger" data-action="delete-card" data-id="' + c.id + '" data-name="' + escapeAttr(c.name) + '" title="delete">🗑️</button></div></div>' +
          '<div class="usage-line"><span>' + t('card_used') + '</span><span class="used mono">' + formatCurrency(balance) + ' (' + pct + '%)</span></div>' +
          '<div class="usage-track"><div class="usage-fill ' + levelCls + '" style="width:' + pct + '%"></div></div>' +
          '<div class="available">' + t('card_available') + ': <span class="mono">' + formatCurrency(available) + '</span></div>' +
          '<button class="btn-ghost btn-block" data-action="open-card" data-id="' + c.id + '">' + t('card_view_btn') + '</button>' +
          '</div>'
        );
      }).join('') + '</div>';
    }

    return (
      '<h2 class="section-title">' + t('cards_title') + '</h2>' +
      '<p class="section-desc">' + t('cards_desc') + '</p>' +
      addForm + tiles
    );
  }

  function renderCardDetail(card) {
    var balance = computeCardBalance(card.id);
    var pct = card.limit > 0 ? Math.max(0, Math.min(100, Math.round((balance / card.limit) * 100))) : 0;
    var levelCls = usageLevelClass(pct);
    var available = card.limit - balance;

    var header = (
      '<button class="card-back-btn" data-action="back-to-cards">' + (state.lang === 'ar' ? '→' : '←') + ' ' + t('back_to_cards') + '</button>' +
      '<div class="card-detail-header"><div><h2>' + escapeHtml(card.name) + '</h2>' +
      '<div class="sub">' + t('card_limit_label') + ': ' + formatCurrency(card.limit) + '</div></div></div>' +
      '<div class="grid-3">' +
      '<div class="card stat-tile"><div class="k">' + t('card_used') + '</div><div class="v">' + formatCurrency(balance) + '</div>' +
      '<div class="usage-track" style="margin-top:10px;margin-bottom:0;"><div class="usage-fill ' + levelCls + '" style="width:' + pct + '%"></div></div></div>' +
      '<div class="card stat-tile"><div class="k">' + t('card_available') + '</div><div class="v positive">' + formatCurrency(available) + '</div></div>' +
      '<div class="card stat-tile"><div class="k">' + t('card_limit_label') + '</div><div class="v">' + formatCurrency(card.limit) + '</div></div>' +
      '</div>'
    );

    return header + '<div class="tx-layout">' + renderCardTxForm(card) + renderCardTxList(card) + '</div>';
  }

  function renderCardTxForm(card) {
    var editingTx = editingCardTxId ? state.cardTransactions.find(function (tx) { return tx.id === editingCardTxId; }) : null;
    var type = editingTx ? editingTx.type : cardTxFormType;
    var date = editingTx ? editingTx.date : todayStr();
    var amount = editingTx ? editingTx.amount : '';
    var note = editingTx ? (editingTx.note || '') : '';
    var submitBtnCls = type === 'purchase' ? 'expense-btn' : 'income-btn';

    return (
      '<form id="card-tx-form" class="card" data-card-id="' + card.id + '">' +
      '<h3 style="margin:0 0 14px;font-size:15px;font-weight:700;">' + (editingTx ? t('card_tx_form_title_edit') : t('card_tx_form_title_new')) + '</h3>' +
      '<div class="type-toggle">' +
      '<button type="button" data-action="set-card-tx-type" data-type="purchase" class="type-btn' + (type === 'purchase' ? ' active-expense' : '') + '">' + t('type_purchase') + '</button>' +
      '<button type="button" data-action="set-card-tx-type" data-type="payment" class="type-btn' + (type === 'payment' ? ' active-income' : '') + '">' + t('type_payment') + '</button>' +
      '</div>' +
      '<input type="hidden" id="card-tx-type" value="' + type + '">' +
      '<div class="grid-2">' +
      '<div class="field"><label>' + t('field_date') + '</label><input type="date" id="card-tx-date" value="' + date + '"></div>' +
      '<div class="field"><label>' + t('field_amount') + '</label><input type="number" step="0.01" id="card-tx-amount" placeholder="0.00" value="' + amount + '"></div>' +
      '</div>' +
      '<div class="field"><label>' + t('field_note') + '</label><input type="text" id="card-tx-note" value="' + escapeAttr(note) + '"></div>' +
      '<div id="card-tx-err" class="err"></div>' +
      '<div class="btn-row">' +
      '<button type="submit" class="btn-primary ' + submitBtnCls + '">' + (editingTx ? t('btn_save_edit') : t('btn_add_tx')) + '</button>' +
      (editingTx ? '<button type="button" class="btn-ghost" data-action="cancel-edit-card-tx">' + t('cancel') + '</button>' : '') +
      '</div>' +
      '</form>'
    );
  }

  function renderCardTxList(card) {
    var txs = state.cardTransactions
      .filter(function (tx) { return tx.cardId === card.id; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var body;
    if (txs.length === 0) {
      body = '<div class="list-empty">' + t('card_tx_empty') + '</div>';
    } else {
      var rows = txs.map(function (tx) {
        var sign = tx.type === 'purchase' ? '+' : '-';
        var cls = tx.type === 'purchase' ? 'expense' : 'income';
        var typeLabel = tx.type === 'purchase' ? t('type_purchase') : t('type_payment');
        return (
          '<tr>' +
          '<td>' + tx.date + '</td>' +
          '<td>' + typeLabel + '</td>' +
          '<td>' + (tx.note ? escapeHtml(tx.note) : '—') + '</td>' +
          '<td class="amt mono ' + cls + '">' + sign + formatCurrency(tx.amount) + '</td>' +
          '<td class="actions">' +
          '<button class="icon-btn" data-action="edit-card-tx" data-id="' + tx.id + '" title="edit">✏️</button>' +
          '<button class="icon-btn danger" data-action="delete-card-tx" data-id="' + tx.id + '" title="delete">🗑️</button>' +
          '</td></tr>'
        );
      }).join('');
      body = (
        '<div class="table-scroll"><table><thead><tr>' +
        '<th>' + t('th_date') + '</th><th>' + t('th_type') + '</th><th>' + t('th_note') + '</th><th class="amt">' + t('th_amount') + '</th><th></th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      );
    }

    return (
      '<div class="card list-card">' +
      '<div class="head">' + t('card_tx_list_title') + ' (' + txs.length + ')</div>' +
      body +
      '</div>'
    );
  }

  // ---------------- Event handling ----------------
  app.addEventListener('submit', function (e) {
    var form = e.target;

    if (form.id === 'setup-form') {
      e.preventDefault();
      var amountEl = document.getElementById('setup-amount');
      var dateEl = document.getElementById('setup-date');
      var value = parseFloat(amountEl.value);
      if (amountEl.value.trim() === '' || isNaN(value)) {
        document.getElementById('setup-err').textContent = t('err_invalid_balance');
        return;
      }
      state.openingBalance = value;
      state.openingBalanceDate = dateEl.value || todayStr();
      saveState();
      render();
      return;
    }

    if (form.id === 'opening-edit-form') {
      e.preventDefault();
      var oAmount = parseFloat(document.getElementById('opening-edit-amount').value);
      var oDate = document.getElementById('opening-edit-date').value;
      if (isNaN(oAmount)) {
        document.getElementById('opening-edit-err').textContent = t('err_invalid_balance');
        return;
      }
      state.openingBalance = oAmount;
      state.openingBalanceDate = oDate || state.openingBalanceDate;
      editingOpeningBalance = false;
      saveState();
      render();
      return;
    }

    if (form.id === 'transaction-form') {
      e.preventDefault();
      var type = document.getElementById('tx-type').value;
      var date = document.getElementById('tx-date').value;
      var amount = parseFloat(document.getElementById('tx-amount').value);
      var categoryId = document.getElementById('tx-category').value;
      var note = document.getElementById('tx-note').value.trim();
      var errEl = document.getElementById('tx-err');

      if (!categoryId) { errEl.textContent = t('err_select_category'); return; }
      if (isNaN(amount) || amount <= 0) { errEl.textContent = t('err_amount'); return; }

      var payload = { date: date, categoryId: categoryId, type: type, amount: amount, note: note || undefined };

      if (editingTransactionId) {
        state.transactions = state.transactions.map(function (tx) {
          return tx.id === editingTransactionId ? Object.assign({ id: tx.id }, payload) : tx;
        });
        editingTransactionId = null;
      } else {
        payload.id = uid();
        state.transactions.push(payload);
      }
      txFormType = 'income';
      saveState();
      render();
      return;
    }

    if (form.dataset && form.dataset.action === 'add-cat') {
      e.preventDefault();
      var type2 = form.dataset.type;
      var input = document.getElementById('new-cat-' + type2);
      var name = input.value.trim();
      if (!name) return;
      state.categories.push({ id: uid(), name: name, type: type2 });
      saveState();
      render();
      return;
    }

    if (form.id === 'card-form') {
      e.preventDefault();
      var cardName = document.getElementById('card-name').value.trim();
      var cardLimit = parseFloat(document.getElementById('card-limit').value);
      var cardErrEl = document.getElementById('card-err');
      if (!cardName) { cardErrEl.textContent = t('err_card_name'); return; }
      if (isNaN(cardLimit) || cardLimit <= 0) { cardErrEl.textContent = t('err_card_limit'); return; }
      state.creditCards.push({ id: uid(), name: cardName, limit: cardLimit });
      saveState();
      render();
      return;
    }

    if (form.id === 'card-tx-form') {
      e.preventDefault();
      var cType = document.getElementById('card-tx-type').value;
      var cDate = document.getElementById('card-tx-date').value;
      var cAmount = parseFloat(document.getElementById('card-tx-amount').value);
      var cNote = document.getElementById('card-tx-note').value.trim();
      var cErrEl = document.getElementById('card-tx-err');

      if (isNaN(cAmount) || cAmount <= 0) { cErrEl.textContent = t('err_amount'); return; }

      var cardId = form.dataset.cardId;
      var cPayload = { cardId: cardId, date: cDate, type: cType, amount: cAmount, note: cNote || undefined };

      if (editingCardTxId) {
        state.cardTransactions = state.cardTransactions.map(function (tx) {
          return tx.id === editingCardTxId ? Object.assign({ id: tx.id }, cPayload) : tx;
        });
        editingCardTxId = null;
      } else {
        cPayload.id = uid();
        state.cardTransactions.push(cPayload);
      }
      cardTxFormType = 'purchase';
      saveState();
      render();
      return;
    }
  });

  app.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.dataset.action;

    if (action === 'tab') {
      currentTab = btn.dataset.tab;
      editingTransactionId = null;
      editingCategoryId = null;
      editingOpeningBalance = false;
      selectedCardId = null;
      editingCardId = null;
      editingCardTxId = null;
      render();
      return;
    }
    if (action === 'prev-month') { currentMonth = shiftMonth(currentMonth, -1); render(); return; }
    if (action === 'next-month') { currentMonth = shiftMonth(currentMonth, 1); render(); return; }

    if (action === 'toggle-theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; saveState(); render(); return; }
    if (action === 'toggle-lang') { state.lang = state.lang === 'ar' ? 'en' : 'ar'; saveState(); render(); return; }

    if (action === 'edit-opening') { editingOpeningBalance = true; render(); return; }
    if (action === 'cancel-edit-opening') { editingOpeningBalance = false; render(); return; }

    if (action === 'set-tx-type') {
      var newType = btn.dataset.type;
      var amountVal = document.getElementById('tx-amount').value;
      var dateVal = document.getElementById('tx-date').value;
      var noteVal = document.getElementById('tx-note').value;
      txFormType = newType;
      if (!editingTransactionId) {
        var formEl = document.getElementById('transaction-form');
        formEl.outerHTML = renderTransactionForm();
        document.getElementById('tx-amount').value = amountVal;
        document.getElementById('tx-date').value = dateVal;
        document.getElementById('tx-note').value = noteVal;
      }
      return;
    }
    if (action === 'cancel-edit-tx') { editingTransactionId = null; render(); return; }
    if (action === 'edit-tx') { editingTransactionId = btn.dataset.id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (action === 'delete-tx') {
      if (confirm(t('confirm_delete_tx'))) {
        state.transactions = state.transactions.filter(function (tx) { return tx.id !== btn.dataset.id; });
        saveState();
        render();
      }
      return;
    }

    if (action === 'edit-cat') { editingCategoryId = btn.dataset.id; render(); return; }
    if (action === 'cancel-cat-edit') { editingCategoryId = null; render(); return; }
    if (action === 'save-cat-edit') {
      var newName = document.getElementById('edit-cat-input').value.trim();
      if (newName) {
        state.categories = state.categories.map(function (c) { return c.id === btn.dataset.id ? Object.assign({}, c, { name: newName }) : c; });
        saveState();
      }
      editingCategoryId = null;
      render();
      return;
    }
    if (action === 'delete-cat') {
      var catMsg = state.lang === 'ar'
        ? ('هل تريد حذف "' + btn.dataset.name + '"؟ سيتم حذف كل العمليات المرتبطة به.')
        : ('Delete "' + btn.dataset.name + '"? All related transactions will be deleted too.');
      if (confirm(catMsg)) {
        var id = btn.dataset.id;
        state.categories = state.categories.filter(function (c) { return c.id !== id; });
        state.transactions = state.transactions.filter(function (tx) { return tx.categoryId !== id; });
        saveState();
        render();
      }
      return;
    }

    // ----- Credit cards -----
    if (action === 'open-card') { selectedCardId = btn.dataset.id; editingCardTxId = null; render(); return; }
    if (action === 'back-to-cards') { selectedCardId = null; render(); return; }
    if (action === 'edit-card') { editingCardId = btn.dataset.id; render(); return; }
    if (action === 'cancel-card-edit') { editingCardId = null; render(); return; }
    if (action === 'save-card-edit') {
      var cName = document.getElementById('edit-card-name').value.trim();
      var cLimit = parseFloat(document.getElementById('edit-card-limit').value);
      var editErrEl = document.getElementById('card-edit-err');
      if (!cName) { editErrEl.textContent = t('err_card_name'); return; }
      if (isNaN(cLimit) || cLimit <= 0) { editErrEl.textContent = t('err_card_limit'); return; }
      state.creditCards = state.creditCards.map(function (c) { return c.id === btn.dataset.id ? Object.assign({}, c, { name: cName, limit: cLimit }) : c; });
      editingCardId = null;
      saveState();
      render();
      return;
    }
    if (action === 'delete-card') {
      var msg = state.lang === 'ar'
        ? ('هل تريد حذف بطاقة "' + btn.dataset.name + '"؟ سيتم حذف كل عملياتها.')
        : ('Delete card "' + btn.dataset.name + '"? All its transactions will be deleted too.');
      if (confirm(msg)) {
        var delId = btn.dataset.id;
        state.creditCards = state.creditCards.filter(function (c) { return c.id !== delId; });
        state.cardTransactions = state.cardTransactions.filter(function (tx) { return tx.cardId !== delId; });
        if (selectedCardId === delId) selectedCardId = null;
        saveState();
        render();
      }
      return;
    }
    if (action === 'set-card-tx-type') {
      var newCType = btn.dataset.type;
      var cAmountVal = document.getElementById('card-tx-amount').value;
      var cDateVal = document.getElementById('card-tx-date').value;
      var cNoteVal = document.getElementById('card-tx-note').value;
      cardTxFormType = newCType;
      if (!editingCardTxId) {
        var cFormEl = document.getElementById('card-tx-form');
        var card = state.creditCards.find(function (c) { return c.id === selectedCardId; });
        cFormEl.outerHTML = renderCardTxForm(card);
        document.getElementById('card-tx-amount').value = cAmountVal;
        document.getElementById('card-tx-date').value = cDateVal;
        document.getElementById('card-tx-note').value = cNoteVal;
      }
      return;
    }
    if (action === 'cancel-edit-card-tx') { editingCardTxId = null; render(); return; }
    if (action === 'edit-card-tx') { editingCardTxId = btn.dataset.id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (action === 'delete-card-tx') {
      if (confirm(t('confirm_delete_tx'))) {
        state.cardTransactions = state.cardTransactions.filter(function (tx) { return tx.id !== btn.dataset.id; });
        saveState();
        render();
      }
      return;
    }
  });

  render();
})();
</script>
</body>
</html>
