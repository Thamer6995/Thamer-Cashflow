    if (action === 'select-all-months') {
      var selAllContainer = document.getElementById(btn.dataset.container);
      if (selAllContainer) Array.from(selAllContainer.querySelectorAll('.month-chip')).forEach(function (c) { c.classList.add('active'); });
      return;
    }
    if (action === 'clear-all-months') {
      var clrAllContainer = document.getElementById(btn.dataset.container);
      if (clrAllContainer) Array.from(clrAllContainer.querySelectorAll('.month-chip')).forEach(function (c) { c.classList.remove('active'); });
      return;
    }
    if (action === 'set-recurring-add-type') {
      var newRecType = btn.dataset.type;
      var savedAmt = document.getElementById('recurring-amount').value;
      var savedDay = document.getElementById('recurring-day').value;
      var savedNote = document.getElementById('recurring-note').value;
      var savedMonths = Array.from(document.querySelectorAll('#recurring-add-months .month-chip.active')).map(function (el) { return el.dataset.month; });
      recurringAddType = newRecType;
      var recFormEl = document.getElementById('recurring-add-form');
      if (recFormEl) {
        recFormEl.outerHTML = renderRecurringAddForm();
        document.getElementById('recurring-amount').value = savedAmt;
        document.getElementById('recurring-day').value = savedDay;
        document.getElementById('recurring-note').value = savedNote;
        Array.from(document.querySelectorAll('#recurring-add-months .month-chip')).forEach(function (chip) {
          chip.classList.toggle('active', savedMonths.indexOf(chip.dataset.month) !== -1);
        });
      }
      return;
    }
    if (action === 'edit-recurring') { editingRecurringId = btn.dataset.id; render(); return; }
    if (action === 'cancel-recurring-edit') { editingRecurringId = null; render(); return; }
    if (action === 'set-recurring-edit-type') {
      var origRuleEdit = state.recurringTransactions.find(function (r) { return r.id === editingRecurringId; });
      if (!origRuleEdit) return;
      var sAmt = document.getElementById('edit-recurring-amount').value;
      var sDay = document.getElementById('edit-recurring-day').value;
      var sNote = document.getElementById('edit-recurring-note').value;
      var sMonths = Array.from(document.querySelectorAll('#recurring-edit-months .month-chip.active')).map(function (el) { return el.dataset.month; });
      var draftRule = Object.assign({}, origRuleEdit, { type: btn.dataset.type });
      var rowEl = document.getElementById('recurring-edit-row');
      if (rowEl) {
        rowEl.outerHTML = renderRecurringEditRow(draftRule);
        document.getElementById('edit-recurring-amount').value = sAmt;
        document.getElementById('edit-recurring-day').value = sDay;
        document.getElementById('edit-recurring-note').value = sNote;
        Array.from(document.querySelectorAll('#recurring-edit-months .month-chip')).forEach(function (chip) {
          chip.classList.toggle('active', sMonths.indexOf(chip.dataset.month) !== -1);
        });
      }
      return;
    }
    if (action === 'save-recurring-edit') {
      var svId = btn.dataset.id;
      var svType = document.getElementById('edit-recurring-type').value;
      var svAmount = parseFloat(document.getElementById('edit-recurring-amount').value);
      var svDay = parseInt(document.getElementById('edit-recurring-day').value, 10);
      var svCategoryId = document.getElementById('edit-recurring-category').value;
      var svNote = document.getElementById('edit-recurring-note').value.trim();
      var svMonths = Array.from(document.querySelectorAll('#recurring-edit-months .month-chip.active')).map(function (el) { return parseInt(el.dataset.month, 10); });
      var svErrEl = document.getElementById('recurring-edit-err');
      if (isNaN(svAmount) || svAmount <= 0) { svErrEl.textContent = t('err_recurring_amount'); return; }
      if (isNaN(svDay) || svDay < 1 || svDay > 31) { svErrEl.textContent = t('err_recurring_day'); return; }
      if (svMonths.length === 0) { svErrEl.textContent = t('err_recurring_months'); return; }
      state.recurringTransactions = state.recurringTransactions.map(function (r) {
        return r.id === svId ? Object.assign({}, r, {
          type: svType, amount: svAmount, dayOfMonth: svDay,
          categoryId: svCategoryId || undefined, note: svNote || undefined, months: svMonths
        }) : r;
      });
      editingRecurringId = null;
      saveState();
      generateDueRecurringTransactions();
      render();
      return;
    }
    if (action === 'delete-recurring') {
      if (confirm(t('confirm_delete_recurring'))) {
        var delRecId = btn.dataset.id;
        state.recurringTransactions = state.recurringTransactions.filter(function (r) { return r.id !== delRecId; });
        saveState();
        render();
      }
      return;
    }

    // ----- Subscriptions -----
    if (action === 'toggle-sub-active') {
      state.subscriptions = state.subscriptions.map(function (s) { return s.id === btn.dataset.id ? Object.assign({}, s, { active: !s.active }) : s; });
      saveState();
      render();
      return;
    }
    if (action === 'edit-sub') { editingSubId = btn.dataset.id; render(); return; }
    if (action === 'cancel-sub-edit') { editingSubId = null; render(); return; }
    if (action === 'save-sub-edit') {
      var subName = document.getElementById('edit-sub-name').value.trim();
      var subAmount = parseFloat(document.getElementById('edit-sub-amount').value);
      var subDay = parseInt(document.getElementById('edit-sub-day').value, 10);
      var subEditErrEl = document.getElementById('sub-edit-err');
      if (!subName) { subEditErrEl.textContent = t('err_sub_name'); return; }
      if (isNaN(subAmount) || subAmount <= 0) { subEditErrEl.textContent = t('err_sub_amount'); return; }
      if (isNaN(subDay) || subDay < 1 || subDay > 31) { subEditErrEl.textContent = t('err_sub_day'); return; }
      state.subscriptions = state.subscriptions.map(function (s) { return s.id === btn.dataset.id ? Object.assign({}, s, { name: subName, amount: subAmount, billingDay: subDay }) : s; });
      editingSubId = null;
      saveState();
      render();
      return;
    }
    if (action === 'delete-sub') {
      var subMsg = 'هل تريد حذف اشتراك "' + btn.dataset.name + '"؟';
      if (confirm(subMsg)) {
        var delSubId = btn.dataset.id;
        state.subscriptions = state.subscriptions.filter(function (s) { return s.id !== delSubId; });
        saveState();
        render();
      }
      return;
    }

    // ----- Investments -----
    if (action === 'edit-investment') { editingInvestmentId = btn.dataset.id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (action === 'cancel-edit-investment') { editingInvestmentId = null; render(); return; }
    if (action === 'delete-investment') {
      if (confirm(t('confirm_delete_investment'))) {
        var delInvId = btn.dataset.id;
        state.investments = state.investments.filter(function (i) { return i.id !== delInvId; });
        saveState();
        render();
      }
      return;
    }

    // ----- Charts -----
    if (action === 'chart-toggle-breakdown') {
      chartBreakdownType = btn.dataset.type;
      chartActive.donut = null;
      render();
      return;
    }
    if (action === 'chart-mark') {
      var chartId = btn.dataset.chart;
      var key = btn.dataset.key;
      chartActive[chartId] = (chartActive[chartId] === key) ? null : key;
      render();
      return;
    }
  });

  function attachFirestoreListener(uid, opts) {
    opts = opts || {};
    if (firestoreUnsubscribe) firestoreUnsubscribe();
    var pendingFirstCheck = !!opts.checkMigration;
    firestoreUnsubscribe = db.collection('users').doc(uid).onSnapshot(function (snap) {
      if (pendingFirstCheck) {
        pendingFirstCheck = false;
        if (snap.exists) {
          state = normalizeState(snap.data());
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          render();
        } else {
          var localSnapshotState = opts.localSnapshotState;
          var hasLocalData = localSnapshotState && (localSnapshotState.openingBalance !== null || localSnapshotState.transactions.length > 0);
          if (hasLocalData) {
            pendingLocalMigration = localSnapshotState;
          } else {
            state = defaultState();
            saveState();
          }
          render();
        }
        return;
      }
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.exists) return;
      state = normalizeState(snap.data());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }, function (err) {
      console.error('Firestore listener error', err);
      authError = t('auth_err_load_failed');
      render();
    });
  }

  auth.onAuthStateChanged(function (user) {
    authLoading = false;
    if (!user) {
      currentUser = null;
      if (firestoreUnsubscribe) { firestoreUnsubscribe(); firestoreUnsubscribe = null; }
      render();
      return;
    }
    currentUser = user;
    attachFirestoreListener(user.uid, { checkMigration: true, localSnapshotState: state });
  });

  render();

  setInterval(function () {
    if (currentUser && state.openingBalance !== null) checkAndFireBrowserNotifications();
  }, 60000);
})();
</script>
</body>
</html>
